name: codex-sandbox

# The core's sandbox check with the real Codex CLI, without a model and
# without a login: scripts/probes/codex-sandbox-check.mjs runs codex sandbox
# in both task modes in a synthetic repository (plain, a linked worktree or
# a submodule). The job gets no credentials.
on:
  workflow_dispatch:
    inputs:
      codex-version:
        description: Exact @openai/codex version (major.minor.patch)
        required: true
        default: '0.164.0'
  pull_request:
    paths:
      - scripts/agent-review-loop-lib.mjs
      - scripts/providers/codex.mjs
      - scripts/providers/contract.mjs
      - scripts/messages/**
      - scripts/probes/**
      - .github/workflows/codex-sandbox.yml

permissions:
  contents: read

jobs:
  sandbox-check:
    name: codex sandbox check (${{ matrix.host }}, ${{ matrix.layout }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      # Every host with every repository layout. The expected result of the
      # probe on each host: on the Ubuntu 24.04 runners, with the default
      # AppArmor restriction of unprivileged user namespaces, the Codex CLI
      # sandbox does not start and the core stops the round
      # (docs/providers/probes/codex-implementer.md, Linux); the job fails
      # when that changes in either direction. ubuntu-latest-userns is the
      # same runner with that restriction lifted (see the step below): there
      # codex sandbox starts and exits with 0, but with the network turned
      # off the check command leaves no result, so the core finds no
      # evidence and stops the round (no-evidence).
      matrix:
        host: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, ubuntu-latest-userns]
        layout: [plain, worktree, submodule]
        include:
          - host: ubuntu-latest
            os: ubuntu-latest
            expect: stop
          - host: ubuntu-24.04-arm
            os: ubuntu-24.04-arm
            expect: stop
          - host: macos-latest
            os: macos-latest
            expect: pass
          - host: ubuntu-latest-userns
            os: ubuntu-latest
            expect: no-evidence
    env:
      # Read by the steps from the environment, never placed in a command.
      CODEX_VERSION: ${{ inputs.codex-version || '0.164.0' }}
      PROBE_EXPECT: ${{ matrix.expect }}
      PROBE_LAYOUT: ${{ matrix.layout }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Check the Codex CLI version input
        run: |
          node -e '
          if (!/^\d+\.\d+\.\d+$/.test(process.env.CODEX_VERSION ?? "")) {
            console.error("codex-version must be major.minor.patch");
            process.exit(1);
          }
          '

      # The runner modules import Node.js built-ins only, so no npm ci.
      - name: Install the Codex CLI
        run: npm install -g "@openai/codex@$CODEX_VERSION"

      - run: codex --version

      # Only in the ubuntu-latest-userns rows, on the ephemeral runner, which
      # is discarded after the job: lifts the AppArmor restriction of
      # unprivileged user namespaces, so that the probe shows the core's
      # check on a Linux host where the Codex CLI sandbox can start. This is
      # not a recommendation for users: the restriction is a hardening of
      # Ubuntu, and ringi never changes kernel settings.
      - name: Lift the user namespace restriction (this runner only)
        if: matrix.host == 'ubuntu-latest-userns'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # Linux only, read only: the user namespace settings of the runner.
      # Also turns on the probe's diagnostics (RINGI_PROBE_DIAGNOSE=1) for
      # the steps after this one; they do not change the probe's exit code.
      - name: Linux namespace diagnostics
        if: runner.os == 'Linux'
        run: |
          uname -a
          for setting in kernel/apparmor_restrict_unprivileged_userns kernel/unprivileged_userns_clone; do
            echo "$setting: $(cat "/proc/sys/$setting" 2>&1)"
          done
          status=0
          unshare --user --map-root-user true || status=$?
          echo "unshare --user --map-root-user true: exit $status"
          status=0
          unshare --user --map-root-user --net ip link set lo up || status=$?
          echo "unshare --user --map-root-user --net ip link set lo up: exit $status"
          echo "bwrap: $(command -v bwrap || echo 'not found')"
          echo "bwrap --version: $(bwrap --version 2>&1)"
          status=0
          bwrap --unshare-user --unshare-net --ro-bind / / true || status=$?
          echo "bwrap --unshare-user --unshare-net --ro-bind / / true: exit $status"
          echo "AppArmor bwrap-userns-restrict profile: $(test -e /etc/apparmor.d/bwrap-userns-restrict && echo present || echo absent)"
          echo "RINGI_PROBE_DIAGNOSE=1" >> "$GITHUB_ENV"

      - name: Sandbox check
        run: node scripts/probes/codex-sandbox-check.mjs --expect "$PROBE_EXPECT" --layout "$PROBE_LAYOUT"
