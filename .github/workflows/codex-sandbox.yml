name: codex-sandbox

# The core's sandbox check with the real Codex CLI, without a model and
# without a login: scripts/probes/codex-sandbox-check.mjs runs codex sandbox
# in both task modes in a synthetic repository. The job gets no credentials.
on:
  workflow_dispatch:
    inputs:
      codex-version:
        description: Exact @openai/codex version (major.minor.patch)
        required: true
        default: '0.164.0'
  pull_request:
    paths:
      - scripts/agent-review-loop-lib.mjs
      - scripts/providers/codex.mjs
      - scripts/providers/contract.mjs
      - scripts/probes/**
      - .github/workflows/codex-sandbox.yml

permissions:
  contents: read

jobs:
  sandbox-check:
    name: codex sandbox check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    env:
      # Read by the steps from the environment, never placed in a command.
      CODEX_VERSION: ${{ inputs.codex-version || '0.164.0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Check the Codex CLI version input
        run: |
          node -e '
          if (!/^\d+\.\d+\.\d+$/.test(process.env.CODEX_VERSION ?? "")) {
            console.error("codex-version must be major.minor.patch");
            process.exit(1);
          }
          '

      # The runner modules import Node.js built-ins only, so no npm ci.
      - name: Install the Codex CLI
        run: npm install -g "@openai/codex@$CODEX_VERSION"

      - run: codex --version

      # Linux only, read only: the user namespace settings of the runner.
      # Also turns on the probe's diagnostics (RINGI_PROBE_DIAGNOSE=1) for
      # the steps after this one; they do not change the probe's exit code.
      - name: Linux namespace diagnostics
        if: runner.os == 'Linux'
        run: |
          uname -a
          for setting in kernel/apparmor_restrict_unprivileged_userns kernel/unprivileged_userns_clone; do
            echo "$setting: $(cat "/proc/sys/$setting" 2>&1)"
          done
          status=0
          unshare --user --map-root-user true || status=$?
          echo "unshare --user --map-root-user true: exit $status"
          status=0
          unshare --user --map-root-user --net ip link set lo up || status=$?
          echo "unshare --user --map-root-user --net ip link set lo up: exit $status"
          echo "bwrap: $(command -v bwrap || echo 'not found')"
          echo "AppArmor bwrap-userns-restrict profile: $(test -e /etc/apparmor.d/bwrap-userns-restrict && echo present || echo absent)"
          echo "RINGI_PROBE_DIAGNOSE=1" >> "$GITHUB_ENV"

      - name: Sandbox check
        run: node scripts/probes/codex-sandbox-check.mjs
