# Example workflow of ringi ci (docs/ci.md). Copy it to
# .github/workflows/ringi-ci.yml of a project that has ringi-gate as a
# devDependency and a ci section in ringi.config.mjs, for example:
#
#   ci: {
#     docsPaths: ['README.md', 'docs/'],
#     lanes: {
#       docs: ['git diff --check'],
#       full: ['git diff --check', 'pnpm test'],
#     },
#   },
#
# The jobs whitespace and test stand for those checks: replace them with the
# jobs of your lanes and change --docs-jobs and --full-jobs to match. No
# model and no credentials; the permissions are read-only. Branch
# protection requires one check: "ringi-ci required".
name: ringi-ci

# edited: a change of the base branch of a pull request must run again (the
# check of the old base would stay green). Every edit of the title or the
# description runs the workflow too: no job is made conditional on the
# changed field, since a skipped job would count as a passed check.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]

permissions:
  contents: read

# One group per pull request, where a newer run cancels the older one; every
# push to the default branch has a group of its own and is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The light preflight, also for a draft: the lane of the change from its
  # real diff. A diff that cannot be classified fails this job; it never
  # becomes a lane.
  classify:
    name: classify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      lane: ${{ steps.lane.outputs.lane }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge commit of the pull request and its parents.
          fetch-depth: 2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Install ringi-gate
        run: |
          corepack enable pnpm
          pnpm install --frozen-lockfile --ignore-scripts

      # A pull request: the diff between the tip of the base branch (the
      # first parent of the merge commit) and the merge commit, which is
      # what the merge would change. A push to the default branch always
      # runs the full lane.
      - name: Choose the lane
        id: lane
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" != pull_request ]; then
            echo lane=full >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="$(git rev-parse HEAD^1)"
          head="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^2)" = "$PR_HEAD"
          pnpm exec ringi ci classify --base "$base" --head "$head" >> "$GITHUB_OUTPUT"

  # Docs lane and full lane: the docs lane's checks are a subset of the
  # full lane's, so this job runs in both.
  whitespace:
    name: whitespace
    needs: classify
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - run: git diff --check HEAD^1 HEAD

  # Full lane only.
  test:
    name: test
    needs: classify
    if: needs.classify.outputs.lane == 'full' && github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Install
        run: |
          corepack enable pnpm
          pnpm install --frozen-lockfile

      - run: pnpm test

  # The required check, under a name that never changes. always() only
  # makes the job run after a failed, cancelled or skipped job (a skipped
  # required check would count as passed); the result is the exit code of
  # ringi ci aggregate, which is green only when the classification and
  # every job of its lane succeeded.
  required:
    name: ringi-ci required
    needs: [classify, whitespace, test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: A draft is not ready
        if: github.event.pull_request.draft == true
        run: |
          echo "Draft pull request: only the preflight ran. The required check stays red until the pull request is ready for review."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Install ringi-gate
        run: |
          corepack enable pnpm
          pnpm install --frozen-lockfile --ignore-scripts

      # Without a lane (the classification failed) the strictest lane is
      # checked, and the failed classification makes the check red.
      - name: Aggregate
        env:
          NEEDS: ${{ toJSON(needs) }}
          LANE: ${{ needs.classify.outputs.lane || 'full' }}
        run: |
          printf '%s' "$NEEDS" > "$RUNNER_TEMP/needs.json"
          pnpm exec ringi ci aggregate --lane "$LANE" --needs "$RUNNER_TEMP/needs.json" --classify-job classify --docs-jobs whitespace --full-jobs whitespace,test
